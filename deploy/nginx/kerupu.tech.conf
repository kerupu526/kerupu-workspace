# kerupu.tech 을 Next 컨테이너(kerupu)로 넘기는 Nginx 설정. 설치 방법은 docs/deploy.md 참고.
#
# 요청이 오는 길:  브라우저 → Cloudflare → cloudflared 터널 → 이 Nginx(80번) → 컨테이너(Tailscale 주소 3100번)
#
# 이 파일의 server 블록은 Host 가 kerupu.tech 인 요청만 맡는다.
# 그 밖의 요청(IP 로 직접 접속, 다른 도메인 등)은 기존 default_server(공사 중 페이지)가 그대로 처리한다.

upstream kerupu_web {
    # docker-compose.yml 이 .env 의 BIND_ADDRESS, HOST_PORT 로 연 주소와 같아야 한다.
    server 100.74.143.1:3100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name kerupu.tech;

    access_log /var/log/nginx/kerupu.access.log;
    error_log  /var/log/nginx/kerupu.error.log;

    # 이미지 업로드(최대 8MB)가 막히지 않게 한다. Nginx 기본은 1MB 라서 이 줄이 없으면 413 오류가 난다.
    client_max_body_size 10m;

    location / {
        proxy_pass http://kerupu_web;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        # 방문자의 실제 주소는 Cloudflare 가 CF-Connecting-IP 로 알려 준다 (이 Nginx 가 보는 접속 주소는 터널이다)
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        # 방문자는 항상 Cloudflare 의 HTTPS 로 들어온다
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
